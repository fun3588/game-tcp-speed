<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 500" width="680" height="500" role="img" style="font-family:-apple-system,BlinkMacSystemFont,'Segoe UI','PingFang SC','Microsoft YaHei',sans-serif">
  <title>Firestorm 加速的两条独立链路</title>
  <desc>游戏客户端发往游戏服务器 IP 的连接被加速器的副 IP 劫持到本机中继，中继可选经 Throne 2080 或独立 sing-box 2081 二选一出网；两条链路都连同一台代理节点，最终到达游戏服务器。两条链路进程、配置、端口完全独立。</desc>

  <rect width="680" height="500" fill="#FFFFFF"/>

  <defs>
    <marker id="ar-gray" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M2 1L8 5L2 9" fill="none" stroke="#888780" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
    </marker>
    <marker id="ar-blue" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M2 1L8 5L2 9" fill="none" stroke="#185FA5" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
    </marker>
    <marker id="ar-teal" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M2 1L8 5L2 9" fill="none" stroke="#0F6E56" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
    </marker>
  </defs>

  <rect x="230" y="40" width="220" height="56" rx="8" fill="#F1EFE8" stroke="#5F5E5A" stroke-width="0.5"/>
  <text x="340" y="60" text-anchor="middle" dominant-baseline="central" font-size="14" font-weight="500" fill="#2C2C2A">WoW 客户端</text>
  <text x="340" y="78" text-anchor="middle" dominant-baseline="central" font-size="12" fill="#5F5E5A">连 141.95.207.63:8285</text>

  <path d="M340 96 L340 130" fill="none" stroke="#888780" stroke-width="1.5" marker-end="url(#ar-gray)"/>
  <text x="352" y="116" font-size="12" fill="#888780" dominant-baseline="central">被劫持到本机</text>

  <rect x="190" y="136" width="300" height="56" rx="8" fill="#F1EFE8" stroke="#5F5E5A" stroke-width="0.5"/>
  <text x="340" y="156" text-anchor="middle" dominant-baseline="central" font-size="14" font-weight="500" fill="#2C2C2A">加速器 · 副 IP 中继</text>
  <text x="340" y="174" text-anchor="middle" dominant-baseline="central" font-size="12" fill="#5F5E5A">本地监听 1119 / 8285 / 8286，源 IP == 目的 IP</text>

  <path d="M300 192 C300 214, 175 210, 175 226" fill="none" stroke="#185FA5" stroke-width="1.5" marker-end="url(#ar-blue)"/>
  <path d="M380 192 C380 214, 505 210, 505 226" fill="none" stroke="#0F6E56" stroke-width="1.5" marker-end="url(#ar-teal)"/>
  <text x="340" y="214" text-anchor="middle" font-size="12" fill="#888780" dominant-baseline="central">二选一</text>

  <rect x="60" y="232" width="230" height="56" rx="8" fill="#E6F1FB" stroke="#185FA5" stroke-width="0.5"/>
  <text x="175" y="252" text-anchor="middle" dominant-baseline="central" font-size="14" font-weight="500" fill="#0C447C">Throne</text>
  <text x="175" y="270" text-anchor="middle" dominant-baseline="central" font-size="12" fill="#185FA5">127.0.0.1:2080 · 原有</text>

  <rect x="390" y="232" width="230" height="56" rx="8" fill="#E1F5EE" stroke="#0F6E56" stroke-width="2"/>
  <text x="505" y="252" text-anchor="middle" dominant-baseline="central" font-size="14" font-weight="500" fill="#04342C">独立 sing-box</text>
  <text x="505" y="270" text-anchor="middle" dominant-baseline="central" font-size="12" fill="#0F6E56">127.0.0.1:2081 · 新增</text>

  <path d="M175 288 C175 310, 300 306, 300 322" fill="none" stroke="#185FA5" stroke-width="1.5" marker-end="url(#ar-blue)"/>
  <path d="M505 288 C505 310, 380 306, 380 322" fill="none" stroke="#0F6E56" stroke-width="1.5" marker-end="url(#ar-teal)"/>

  <rect x="210" y="328" width="260" height="56" rx="8" fill="#F1EFE8" stroke="#5F5E5A" stroke-width="0.5"/>
  <text x="340" y="348" text-anchor="middle" dominant-baseline="central" font-size="14" font-weight="500" fill="#2C2C2A">代理节点（欧服）</text>
  <text x="340" y="366" text-anchor="middle" dominant-baseline="central" font-size="12" fill="#5F5E5A">独立代理专线 · 共享流量</text>

  <path d="M340 384 L340 418" fill="none" stroke="#888780" stroke-width="1.5" marker-end="url(#ar-gray)"/>

  <rect x="220" y="424" width="240" height="56" rx="8" fill="#F1EFE8" stroke="#5F5E5A" stroke-width="0.5"/>
  <text x="340" y="444" text-anchor="middle" dominant-baseline="central" font-size="14" font-weight="500" fill="#2C2C2A">游戏服务器</text>
  <text x="340" y="462" text-anchor="middle" dominant-baseline="central" font-size="12" fill="#5F5E5A">141.95.207.63:8285 / 8286</text>
</svg>
